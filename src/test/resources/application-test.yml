# ============================================================
# 测试专用配置（由 @ActiveProfiles("test") 激活）
#
# 关键约束：测试连的是**独立库** badminton_community_test，
# 绝不碰开发库 badminton_community。
# TestSchemaBootstrap 在建表前会再校验一次库名后缀（必须以 _test 结尾），
# 写错的话直接抛异常炸在启动阶段，而不是把开发库删干净。
#
# createDatabaseIfNotExist=true：第一次跑测试时自动建库，无需手工执行 SQL。
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/badminton_community_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 并发用例会同时开多条连接（最多 8 线程），默认 10 够用，这里留一点余量
      maximum-pool-size: 12
      pool-name: badminton-test-pool

app:
  jwt:
    # 仅供独立测试库的测试上下文使用，不用于本地运行或部署
    secret: test-only-jwt-signing-key-with-32-plus-bytes

logging:
  level:
    # 关掉 MyBatis 的 SQL 调试输出，否则 800+ 行刷屏看不到断言失败
    com.badmintoncommunity: warn
    org.springframework.test: warn
