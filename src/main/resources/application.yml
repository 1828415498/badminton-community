server:
  # 注意：若运行环境注入了环境变量 SERVER__PORT（如 WorkBuddy 沙箱会注入 0），
  # 其优先级高于本配置，将导致随机端口；此时以命令行参数覆盖：java -jar xx.jar --server.port=8080
  port: 8080

spring:
  application:
    name: badminton-community
  datasource:
    url: jdbc:mysql://localhost:3306/badminton_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 默认上限只有 1MB，手机拍的头像很容易超 —— 调到 5MB
      # （与 ResultCode.FILE_TOO_LARGE 的提示文案保持一致）
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    # 全局 JSON 字段命名 snake_case（与 api.md §1.1 约定一致）
    property-naming-strategy: SNAKE_CASE

mybatis:
  configuration:
    # 数据库 snake_case 与实体 camelCase 映射（database.md 字段命名约定）
    map-underscore-to-camel-case: true

logging:
  level:
    com.badmintoncommunity.module: debug

app:
  jwt:
    # 开发环境密钥（HS256 要求 >= 32 字节）；上线前必须改为环境变量注入
    secret: "badminton-community-dev-secret-key-please-change-in-prod-0123456789"
    expire-hours: 24
  upload:
    # 图片落盘目录。相对路径以「应用启动目录」为基准（本地开发即项目根目录）。
    # 上线后若应用目录不可写，改这里指向独立磁盘即可，代码无需改动。
    dir: ./uploads
    # 对外访问前缀，必须与 WebConfig 里的静态资源映射保持一致
    url-prefix: /api/files
    # 允许的图片扩展名（小写、不含点）
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
