server:
  # 注意：若运行环境注入了环境变量 SERVER__PORT（如 WorkBuddy 沙箱会注入 0），
  # 其优先级高于本配置，将导致随机端口；此时以命令行参数覆盖：java -jar xx.jar --server.port=8080
  port: 8080

spring:
  application:
    name: badminton-community
  datasource:
    url: jdbc:mysql://localhost:3306/badminton_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    # 全局 JSON 字段命名 snake_case（与 api.md §1.1 约定一致）
    property-naming-strategy: SNAKE_CASE

mybatis:
  configuration:
    # 数据库 snake_case 与实体 camelCase 映射（database.md 字段命名约定）
    map-underscore-to-camel-case: true

logging:
  level:
    com.badmintoncommunity.module: debug

app:
  jwt:
    # 开发环境密钥（HS256 要求 >= 32 字节）；上线前必须改为环境变量注入
    secret: "badminton-community-dev-secret-key-please-change-in-prod-0123456789"
    expire-hours: 24
